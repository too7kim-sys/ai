# 공통 설정 — 프로파일별 application-{profile}.properties로 override 가능

# 시간대 / 인코딩
# JVM 기본 TZ 는 Asia/Seoul 로 운영 권장. 컨테이너/배포 스크립트에 다음 중 하나를 지정:
#   - JVM 옵션:           -Duser.timezone=Asia/Seoul
#   - 환경 변수(컨테이너): TZ=Asia/Seoul
# 코드 안에서 시각 비교를 하는 곳(PayrollServiceImpl.toLocalDate, CalendarController.parse)
# 은 명시적으로 ZoneId.of("Asia/Seoul") 을 사용해 UTC 컨테이너에서도 안전.
spring.profiles.active=${spring.profiles.active:dev}

# Pool
db.pool.max=20
db.pool.min=2

# Mail (기본은 비활성, dev/prod에서 override)
mail.host=localhost
mail.port=25
mail.username=
mail.password=
mail.protocol=smtp
mail.auth=false
mail.tls=false
mail.debug=false
mail.from=noreply@company.com

# 정책 코드
policy.password.expire-days=90
policy.password.history-count=5
policy.login.max-fail=5
policy.login.lock-minutes=30
policy.session.timeout-minutes=30

# 비즈니스 코드
biz.work.month-hours=209
biz.work.overtime-rate=1.5
biz.work.night-rate=0.5
biz.work.holiday-rate=1.5
biz.expense.executive-threshold=1000000

# 첨부 저장 경로
storage.local.path=${user.home}/groupware-uploads
