# 개발 환경 — H2 in-memory (PostgreSQL 호환)
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:groupware;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# H2는 EXCLUDE 제약, gist 인덱스, 일부 PostgreSQL 함수가 지원되지 않음 → Flyway에서 dialect 별도 처리
flyway.locations=classpath:db/migration,classpath:db/migration-h2
