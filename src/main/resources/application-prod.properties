# 운영 환경 — PostgreSQL (환경변수 우선)
db.driver=org.postgresql.Driver
db.url=${DB_URL:jdbc:postgresql://localhost:5432/groupware}
db.username=${DB_USER:groupware}
db.password=${DB_PWD:}

mail.host=${MAIL_HOST:smtp.example.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:noreply@company.com}
mail.protocol=smtps
mail.auth=true
mail.tls=true
